# OINK Starter — the only site configuration file.

title: Xiao Zhi Xiao He
baseURL: https://blog.xjkj.org/
defaultContentLanguage: en
enableGitInfo: false
enableRobotsTXT: true
enableEmoji: true
timeZone: Asia/Shanghai

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: Xiao Zhi Xiao He
    params:
      description: Notes and technical sharing.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: 小知小和
    hasCJKLanguage: true
    params:
      description: 知识沉淀与技术分享。

# OINK's Markdown components depend on these three Goldmark settings.
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: 小知小和 · Xiao Zhi Xiao He
    from_year: 2026
  footer_center_info: '内容仅代表个人观点 · Views are my own'
  ui:
    compare: true
    preset: paper
    preset_menu: [paper, slate, ink, terminal]
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    backlinks: true

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.168.0
